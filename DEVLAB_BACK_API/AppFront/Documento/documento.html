<!DOCTYPE htlm>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Gestão de Documentos</title>
    <link rel="stylesheet" href="documento.css" />
    
</head>
<body>
    <h1>Gestão de documentos</h1>

    <div class="form-container">
        <input type="number" id="CodigoCliente" placeholder="coloque o código do cliente" />
        <input type="file" id="arquivo" />
        <button id="BtEnviar" onclick="enviarDocumento()">Enviar</button>
        <button id="BtListar" onclick="ListarDocumentos()">Listar</button>

        <table id="tabelaDocumentos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Extensão</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <!-- Dados carregados via JS -->
            </tbody>
        </table>

    </div>
    <script src="documento.js"></script>
</body>
</html>
